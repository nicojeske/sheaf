[project]
name = "sheaf"
version = "0.1.0"
description = "Document and receipt scanner for the Canon imageFORMULA P-208II with Paperless-ngx upload"
requires-python = ">=3.13"
# NOTE: PyGObject (gi) is deliberately absent. It is provided by the system
# package python-gobject; the venv must be created with --system-site-packages.
# See run.sh and README.md.
dependencies = [
    "img2pdf>=0.5",
    "keyring>=25",
    "tomli-w>=1.0",
    "requests>=2.31",
    "pillow>=10",
]

[project.scripts]
sheaf = "sheaf.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
